title: Regenmesser Dashboard
views:
  - title: Regen
    cards:
      - type: gauge
        entity: sensor.regen_heute
        name: Regen heute
        min: 0
        max: 20
        severity:
          - color: '#4caf50'
            from: 0
            to: 5
          - color: '#ffb300'
            from: 5
            to: 10
          - color: '#ff5722'
            from: 10
            to: 20

      - type: history-graph
        entities:
          - sensor.regen_heute
          - sensor.regenrate_1m
        hours_to_show: 24
        title: Niederschlagsverlauf

      - type: statistics-graph
        entities:
          - sensor.regen_heute
          - sensor.regen_woche
          - sensor.regen_monat
        stat_types:
          - sum
        title: Niederschlagsstatistik

      - type: entities
        title: Regenstatus
        entities:
          - sensor.kippvorgange_gesamt
          - sensor.regenrate_1m
          - sensor.regenrate_10m
          - sensor.regenrate_60m
